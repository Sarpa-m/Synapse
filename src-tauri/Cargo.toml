[package]
name = "synapse-desktop"
version = "0.2.1"
description = "Synapse Desktop - Sistema de Assistência Textual de IA em Background para Windows"
authors = ["Synapse Team"]
edition = "2021"

[lib]
name = "synapse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
arboard = "3.4"
enigo = "0.2"
keyring = { version = "3.6", features = ["windows-native"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
mockall = "0.13"
wiremock = "0.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
