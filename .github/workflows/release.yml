name: Release Windows (.exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (Release profile)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: release-profile
          cache-all-crates: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract release notes from CHANGELOG.md & Prepare GitHub Release
        id: changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $notesFile = "$env:RUNNER_TEMP/release_notes.md"
          $notes = ""

          if (Test-Path "CHANGELOG.md") {
            $raw = Get-Content "CHANGELOG.md" -Raw -Encoding UTF8
            $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
            $match = [regex]::Match($raw, $pattern)
            if ($match.Success) {
              $notes = $match.Groups[1].Value.Trim()
            }
          }

          if ([string]::IsNullOrWhiteSpace($notes)) {
            $prevTag = git describe --tags --abbrev=0 "HEAD^" 2>$null
            if ($LASTEXITCODE -eq 0 -and $prevTag) {
              $commits = git log "$prevTag..HEAD" --pretty=format:"- %s (%h)"
            } else {
              $commits = git log -n 15 --pretty=format:"- %s (%h)"
            }
            $notes = "### Alterações nesta versão`n`n" + ($commits -join "`n")
          }

          Set-Content -Path $notesFile -Value $notes -Encoding UTF8
          "notes_file=$notesFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Garante que a release já exista antes do tauri-action para evitar falha de criação na API
          gh release view $tag >$null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Synapse Desktop $tag" --notes-file $notesFile
          } else {
            gh release edit $tag --title "Synapse Desktop $tag" --notes-file $notesFile
          }

      - name: Build Tauri app & upload installers (.exe / .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Synapse Desktop v__VERSION__"
          releaseBody: "Consulte abaixo as alterações e correções desta versão."
          releaseDraft: false
          prerelease: false

      - name: Upload standalone portable .exe & finalize Release Notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $exePath = "src-tauri/target/release/synapse-desktop.exe"
          if (Test-Path $exePath) {
            gh release upload $tag $exePath --clobber
          }
          if (Test-Path "${{ steps.changelog.outputs.notes_file }}") {
            gh release edit $tag --notes-file "${{ steps.changelog.outputs.notes_file }}"
          }
