name: CI — Testes e Qualidade

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-test:
    name: Frontend (Typecheck, Vitest & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Verify production bundle
        run: npm run build

  backend-test:
    name: Backend Rust (Fmt, Clippy & Cargo Test)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache (Test profile)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: test-profile

      - name: Check formatting (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Lint (cargo clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests (cargo test)
        working-directory: src-tauri
        run: cargo test
